# ==============================================================================
# MySQL Database Connection Properties
# Personal Expense Tracker (JDBC Configuration)
# ==============================================================================

# Database Driver Class
db.driver=com.mysql.cj.jdbc.Driver

# Database Connection URL (Auto-creates schema if permissions allow)
db.url=jdbc:mysql://localhost:3306/expense_tracker_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true

# Database Credentials
db.user=root
db.password=

# Notes:
# 1. To run with MySQL, ensure MySQL Server is active and place mysql-connector-j-*.jar into the lib/ directory.
# 2. If MySQL is offline or the driver is not in lib/, the application automatically switches to In-Memory Collections mode.
